name: Credential Store Canary

on:
  workflow_dispatch:
    inputs:
      run_canary:
        description: "Run opt-in real credential-store canary tests"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  real-credential-store-canary:
    name: Real credential-store canary (${{ matrix.os }})
    if: ${{ inputs.run_canary || github.event_name == 'schedule' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Use Intel: ARM hosted images cannot unlock a
        # newly-created keychain for SecItemCopyMatching (actions/runner-images#13476).
        os: [ubuntu-latest, macos-15-intel, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: bash .github/scripts/install-linux-dependencies.sh dbus-x11 gnome-keyring libdbus-1-dev pkg-config

      - name: Configure disposable macOS Keychain
        if: matrix.os == 'macos-15-intel'
        shell: bash
        run: |
          set -euo pipefail
          keychain_path="$HOME/Library/Keychains/aisw-canary.keychain-db"
          mkdir -p "$(dirname "$keychain_path")"
          security create-keychain -p "" "$keychain_path"
          security set-keychain-settings -lut 3600 "$keychain_path"
          security unlock-keychain -p "" "$keychain_path"
          security list-keychains -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security default-keychain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Run real credential-store canary (ignored test)
        env:
          AISW_ENABLE_REAL_CREDENTIAL_STORE_CANARY: "1"
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            dbus-run-session -- bash -c "set -euo pipefail; eval \"\$(printf '\\n' | gnome-keyring-daemon --unlock --components=secrets)\"; cargo test --locked --test real_credential_store_canary -- --list | grep -F \"real_credential_store_canary_covers_secure_auth_modes\""
          elif [ "${{ matrix.os }}" = "macos-15-intel" ]; then
            keychain_path="$HOME/Library/Keychains/aisw-canary.keychain-db"
            security unlock-keychain -p "" "$keychain_path"
            security default-keychain -d user -s "$keychain_path"
            cargo test --locked --test real_credential_store_canary -- --list \
              | grep -F "real_credential_store_canary_covers_secure_auth_modes"
          else
            cargo test --locked --test real_credential_store_canary -- --list \
              | grep -F "real_credential_store_canary_covers_secure_auth_modes"
          fi

      - name: Sign disposable canary executables (macOS)
        if: matrix.os == 'macos-15-intel'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test real_credential_store_canary --no-run --message-format=json > "$RUNNER_TEMP/canary-artifacts.json"
          canary_binary=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "real_credential_store_canary") | .executable // empty' "$RUNNER_TEMP/canary-artifacts.json")
          test -n "$canary_binary"
          codesign --force --sign - "$canary_binary"
          codesign --force --sign - target/debug/aisw
          echo "AISW_CANARY_TEST_BINARY=$canary_binary" >> "$GITHUB_ENV"

      - name: Execute real credential-store canary
        env:
          AISW_ENABLE_REAL_CREDENTIAL_STORE_CANARY: "1"
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            dbus-run-session -- bash -c "set -euo pipefail; eval \"\$(printf '\\n' | gnome-keyring-daemon --unlock --components=secrets)\"; cargo test --locked --test real_credential_store_canary real_credential_store_canary_covers_secure_auth_modes -- --ignored --nocapture"
          elif [ "${{ matrix.os }}" = "macos-15-intel" ]; then
            keychain_path="$HOME/Library/Keychains/aisw-canary.keychain-db"
            security unlock-keychain -p "" "$keychain_path"
            security default-keychain -d user -s "$keychain_path"
            "$AISW_CANARY_TEST_BINARY" \
              real_credential_store_canary_covers_secure_auth_modes --ignored --nocapture &
            canary_pid=$!
            (
              sleep 45
              if kill -0 "$canary_pid" 2>/dev/null; then
                for cli_pid in $(pgrep -x aisw || true); do
                  sample "$cli_pid" 2 1 -file "$RUNNER_TEMP/aisw-$cli_pid.stack" || true
                  if [ -f "$RUNNER_TEMP/aisw-$cli_pid.stack" ]; then
                    cat "$RUNNER_TEMP/aisw-$cli_pid.stack"
                  fi
                done
                kill -TERM "$canary_pid"
              fi
            ) &
            watchdog_pid=$!
            canary_result=0
            wait "$canary_pid" || canary_result=$?
            kill "$watchdog_pid" 2>/dev/null || true
            exit "$canary_result"
          else
            cargo test --locked --test real_credential_store_canary \
              real_credential_store_canary_covers_secure_auth_modes -- --ignored --nocapture
          fi

      - name: Remove disposable macOS Keychain
        if: ${{ always() && matrix.os == 'macos-15-intel' }}
        shell: bash
        run: |
          keychain_path="$HOME/Library/Keychains/aisw-canary.keychain-db"
          if [ -f "$keychain_path" ]; then
            security delete-keychain "$keychain_path"
          fi
